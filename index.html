<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Caça-Ofertas — Praia Digital</title><meta name="description" content="Score instantâneo de oportunidade imobiliária no litoral: compare o preço pedido com o valor de mercado."><link rel="canonical" href="https://praia.digital/caca-ofertas/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1220;color:#e8ecf1}main{max-width:760px;margin:auto;padding:24px}input,select{width:100%;padding:10px;border-radius:8px;background:#0f172a;color:#e8ecf1;border:1px solid #243348;margin:4px 0 12px;box-sizing:border-box}.panel{background:#121c2e;border:1px solid #243348;border-radius:14px;padding:20px;margin-bottom:14px}.score{font-size:44px;font-weight:800;color:#22d3ee}.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#1f6feb;color:#fff;text-decoration:none;font-weight:600;border:0;cursor:pointer}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/alerta-ofertas/" style="color:#9fd8ff;margin-right:12px">Alerta de Ofertas</a><a href="https://praia.digital/radar-precos/" style="color:#9fd8ff;margin-right:12px">Radar de Preços</a><a href="https://praia.digital/investidores/" style="color:#9fd8ff">Radar do Investidor</a></nav><main><h1>🎯 Caça-Ofertas</h1><p>Descubra em segundos se aquele anúncio é uma pechincha ou uma cilada.</p><div class="panel"><label>Cidade</label><select id="c"><option value="9500">Santos</option><option value="9000">Guarujá</option><option value="6500">Praia Grande</option><option value="6000">São Vicente</option><option value="7000">Bertioga</option><option value="5000">Mongaguá</option><option value="4800">Itanhaém</option><option value="4500">Peruíbe</option></select><label>Área (m²)</label><input id="a" type="number" value="60"><label>Preço pedido (R$)</label><input id="p" type="number" value="450000"><label>Ágio extra: vista mar / frente praia? (%)</label><input id="v" type="number" value="0"><button class="btn" onclick="go()">Avaliar oferta</button></div><div class="panel" id="r" style="display:none"><div class="score" id="s"></div><p id="t"></p><p><a class="btn" href="https://praia.digital/avaliador-imoveis/">Avaliação detalhada</a> <a class="btn" href="https://praia.digital/simulador-roi/">Simular ROI</a></p></div></main><script>function go(){const m2=+document.getElementById('c').value,a=+document.getElementById('a').value||1,p=+document.getElementById('p').value||0,v=+document.getElementById('v').value||0;const justo=m2*a*(1+v/100);const diff=(justo-p)/justo*100;const s=Math.max(0,Math.min(100,Math.round(50+diff*2.5)));document.getElementById('r').style.display='block';document.getElementById('s').textContent=s+'/100';document.getElementById('t').textContent='Valor de mercado estimado: '+justo.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})+' ('+(diff>=0?diff.toFixed(0)+'% abaixo do mercado — oportunidade!':(-diff).toFixed(0)+'% acima do mercado — negocie')+')';}</script></body></html>
